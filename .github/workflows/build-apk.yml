name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version
          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$RAW_VERSION" ]; then
            echo "ERROR: Active Java version cannot be detected."
            exit 1
          fi
          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $MAJOR_VERSION"
          if [ -z "$MAJOR_VERSION" ]; then
            echo "ERROR: Active Java major version cannot be determined."
            exit 1
          fi
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java major version is $MAJOR_VERSION, which is lower than 17."
            exit 1
          fi
          echo "Confirmed Java version is 17 or newer ($RAW_VERSION)."

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Reusing existing file."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore"
              exit 1
            fi
            echo "Successfully generated ./debug.keystore"
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK not found at $TARGET_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            fi
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK at $TARGET_APK is empty!"
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: $TARGET_APK does not have .apk extension"; exit 1 ;;
          esac
          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Target APK path mismatch!"
            exit 1
          fi
          echo "APK successfully verified at $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP:-/tmp}/release_asset"
          mkdir -p "$ASSET_DIR"
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="$ASSET_DIR/app-debug.apk"
          cp "$SOURCE_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ]; then
            echo "ERROR: Failed to copy APK to $DEST_APK"
            exit 1
          fi
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at $DEST_APK"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version || { echo "ERROR: gh CLI not found"; exit 1; }
          RELEASE_ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ]; then
            echo "ERROR: Prepared APK does not exist at $RELEASE_ASSET"
            exit 1
          fi
          if [ ! -s "$RELEASE_ASSET" ]; then
            echo "ERROR: Prepared APK is empty"
            exit 1
          fi
          case "$RELEASE_ASSET" in
            *.apk) ;;
            *) echo "ERROR: Release asset does not have .apk extension"; exit 1 ;;
          esac
          ASSET_NAME=$(basename "$RELEASE_ASSET")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename is $ASSET_NAME, expected app-debug.apk"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          GitHub Actions run number: ${{ github.run_number }}
          GitHub Actions run attempt: ${{ github.run_attempt }}
          Source commit SHA: ${{ github.sha }}
          APK is intended for testing.
          APK is not a Play Store production release.
          Signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$TAG_NAME" "$RELEASE_ASSET" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "GitHub Release published successfully."
            gh release view "$TAG_NAME" || true
            echo "Release tag: $TAG_NAME"
            echo "Release title: Debug APK Build #${{ github.run_number }}"
            echo "APK filename: app-debug.apk"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Direct URL: $DIRECT_URL"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "[Download app-debug.apk]($DIRECT_URL)"
              echo ""
              echo "\`$DIRECT_URL\`"
              echo ""
              echo "The normal Actions artifact \`app-debug-apk\` also remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation did not complete successfully."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully."
              echo "The GitHub Actions backup artifact 'app-debug-apk' remains available for download."
            fi
            {
              echo "## APK Build Status"
              echo ""
              echo "Release publishing could not be completed, but the Actions artifact \`app-debug-apk\` remains available."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
